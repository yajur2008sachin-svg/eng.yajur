<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hotel Room Booking Form</title>
</head>
<body>
  <br><br>
  <table border="1" cellspacing="0" cellpadding="20" align="center" width="460">
    <tr>
      <td align="center">

        <h2>Hotel Room Booking Form</h2>

        <form>
          
          <p>
            <label>Full Name:</label>
            <input type="text" name="full_name" size="22">
          </p>

          <p>
            <label>Email:</label>
            <input type="email" name="email" size="22">
          </p>

          <p>
            <label>Phone:</label>
            <input type="tel" name="phone" size="22">
          </p>

          <p>
            <label>Check-in Date:</label>
            <input type="date" name="check_in">
          </p>

          <p>
            <label>Check-out Date:</label>
            <input type="date" name="check_out">
          </p>

            <p>
                <label>Room Type:</label>
                <select name="room_type">
                    <option value="single">Single Room</option>
                    <option value="double">Double Room</option>
                    <option value="deluxe">Deluxe Room</option>
                    <option value="suite">Suite</option>
                </select>
          </p>

          <p>
                <label>Number of Guests:</label>
                <input type="number" name="guests" style="width: 60px;">
          </p>

          <p>
            <label>Special Requests:</label><br>
            <textarea name="special_requests" rows="4" cols="42"></textarea>
          </p>

          <p>
            <button type="submit">Book Now</button>
            <button type="reset">Reset Form</button>
          </p>

        </form>

      </td>
    </tr>
  </table>

</body>
</html>
