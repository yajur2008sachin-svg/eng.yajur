<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 9</title>
</head>
<body>

    <!-- 1. Blockquote for indented long quote -->
    <blockquote>
        The best way to predict the future is to create it.
    </blockquote>

    <!-- 2. Inline quote (<q> automatically adds quotation marks) -->
    <p>As he said, "Stay hungry, stay foolish".</p>

    <!-- 3. Citation tag for book title -->
    <p>Book: <cite>The Pragmatic Programmer</cite></p>

    <!-- 4. Abbreviation tag with title attribute for hover tooltip -->
    <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>

    <!-- 5. Address tag for contact information -->
    <address>
        Contact: Admin Office<br>
        College Road, Delhi
    </address>

    <!-- 6. Deleted and inserted tags for price update -->
    <p><del>Old price 500</del> <ins>New price 400</ins></p>

</body>
</html>
